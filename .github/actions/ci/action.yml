name: CI
description: Runs CI checks

runs:
    using: composite
    steps:
        - name: Prepare workspace
          uses: ./.github/actions/prepare-workspace

        - name: Check Dockerfile
          shell: bash
          run: docker build --check --debug -f .docker/Dockerfile .

        - name: Check docker-bake.hcl
          shell: bash
          run: |
              docker buildx bake -f .docker/docker-bake.hcl --print
              docker buildx bake -f .docker/docker-bake.hcl ci --print

        - name: Compile core
          shell: bash
          run: pnpm build

        - name: Run typechecks
          shell: bash
          run: pnpm -r run typecheck

        - name: Run tests
          shell: bash
          # `-w` targets only the workspace root's own script; `-r` targets every *other* workspace package,
          # since pnpm's recursive mode excludes the workspace root itself. Both invocations are needed to
          # cover the whole workspace — neither one alone is redundant with the other. No `--if-present`:
          # `-w` targets exactly one package, so it fails loudly if the root ever loses this script. `-r`
          # already tolerates a package missing the script by design (pnpm skips it rather than erroring,
          # as long as at least one selected package has it) — `--if-present` wouldn't change that either
          # way, so it's dropped here too for consistency rather than to enforce anything.
          run: |
              pnpm playwright-install-browsers
              pnpm -w run test-ci
              pnpm -r run test-ci

        - name: Run Prettier
          shell: bash
          run: pnpm format-check

        - name: Run ESLint
          shell: bash
          # Same `-w`/`-r` split (and the same `--if-present` reasoning) as the "Run tests" step above.
          run: |
              pnpm -w run lint-ts
              pnpm -r run lint-ts

        - name: Run Stylelint
          shell: bash
          run: pnpm lint-css

        - name: Run Markdownlint
          shell: bash
          run: pnpm lint-md
