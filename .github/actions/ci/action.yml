name: CI
description: Runs CI checks

runs:
    using: composite
    steps:
        - name: Prepare workspace
          uses: ./.github/actions/prepare-workspace

        - name: Check Dockerfile
          shell: bash
          run: docker build --check --debug -f .docker/Dockerfile .

        - name: Check docker-bake.hcl
          shell: bash
          run: |
              docker buildx bake -f .docker/docker-bake.hcl --print
              docker buildx bake -f .docker/docker-bake.hcl ci --print

        - name: Compile core
          shell: bash
          run: pnpm build

        - name: Run typechecks
          shell: bash
          run: pnpm --if-present -r run typecheck

        - name: Run tests
          shell: bash
          run: |
              pnpm playwright-install-browsers
              pnpm --if-present -w run test-ci
              pnpm --if-present -r run test-ci

        - name: Run Prettier
          shell: bash
          run: pnpm format-check

        - name: Run ESLint
          shell: bash
          run: |
              pnpm --if-present -w run lint-ts
              pnpm --if-present -r run lint-ts

        - name: Run Stylelint
          shell: bash
          run: pnpm lint-css

        - name: Run Markdownlint
          shell: bash
          run: pnpm lint-md
