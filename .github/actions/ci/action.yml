name: CI
description: Runs CI checks

runs:
    using: composite
    steps:
        - name: Prepare workspace
          uses: ./.github/actions/prepare-workspace

        - name: Check Dockerfile
          shell: bash
          run: docker build --check --debug -f .docker/Dockerfile .

        - name: Check docker-bake.hcl
          shell: bash
          run: |
              docker buildx bake -f .docker/docker-bake.hcl --print
              docker buildx bake -f .docker/docker-bake.hcl ci --print

        - name: Compile core
          shell: bash
          run: pnpm build

        - name: Run typechecks
          shell: bash
          run: pnpm --if-present -r run typecheck

        - name: Run tests
          shell: bash
          # `-w` targets only the workspace root's own script; `-r` targets every *other* workspace package,
          # since pnpm's recursive mode excludes the workspace root itself. Both invocations are needed to
          # cover the whole workspace — neither one alone is redundant with the other.
          run: |
              pnpm playwright-install-browsers
              pnpm --if-present -w run test-ci
              pnpm --if-present -r run test-ci

        - name: Run Prettier
          shell: bash
          run: pnpm format-check

        - name: Run ESLint
          shell: bash
          # Same `-w`/`-r` split as the "Run tests" step above, and for the same reason: pnpm's recursive
          # mode excludes the workspace root, so both invocations are needed to cover the whole workspace.
          run: |
              pnpm --if-present -w run lint-ts
              pnpm --if-present -r run lint-ts

        - name: Run Stylelint
          shell: bash
          run: pnpm lint-css

        - name: Run Markdownlint
          shell: bash
          run: pnpm lint-md
