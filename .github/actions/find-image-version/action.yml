name: Find image version
description: Looks up a Docker Hub repository tag

inputs:
    namespace:
        description: Docker Hub namespace (org or user) the repository belongs to
        required: true
    repository:
        description: Name of the Docker Hub repository
        required: true
    tag:
        description: Tag to look up
        required: true
    token:
        description: Docker Hub access token with read access, used to authenticate to the Docker Hub API
        required: true
    username:
        description: Docker Hub username paired with the access token
        required: true

outputs:
    exists:
        description: Whether the given tag was found
        value: ${{ steps.find.outputs.exists }}

runs:
    using: composite
    steps:
        - name: Find tag ${{ inputs.tag }}
          id: find
          shell: bash
          env:
              USERNAME: ${{ inputs.username }}
              PASSWORD: ${{ inputs.token }}
              NAMESPACE: ${{ inputs.namespace }}
              REPOSITORY: ${{ inputs.repository }}
              TAG: ${{ inputs.tag }}
          run: |
              jwt=$(curl -sf -X POST "https://hub.docker.com/v2/users/login/" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg u "$USERNAME" --arg p "$PASSWORD" '{username: $u, password: $p}')" \
                  | jq -r '.token')

              status=$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer ${jwt}" \
                  "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${REPOSITORY}/tags/${TAG}/")

              if [ "$status" = "200" ]; then
                  echo "Found tag ${TAG} in ${NAMESPACE}/${REPOSITORY}."
                  echo "exists=true" >> "$GITHUB_OUTPUT"
              elif [ "$status" = "404" ]; then
                  echo "No tag ${TAG} found in ${NAMESPACE}/${REPOSITORY}."
                  echo "exists=false" >> "$GITHUB_OUTPUT"
              else
                  echo "Unexpected response (HTTP ${status}) looking up ${NAMESPACE}/${REPOSITORY}:${TAG}." >&2
                  exit 1
              fi
