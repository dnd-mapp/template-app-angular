name: Remove image
description: Deletes a Docker Hub repository tag, if it exists

inputs:
    namespace:
        description: Docker Hub namespace (org or user) the repository belongs to
        required: true
    repository:
        description: Name of the Docker Hub repository
        required: true
    tag:
        description: Tag to remove
        required: true
    token:
        description: Docker Hub access token with delete access, used to authenticate to the Docker Hub API
        required: true
    username:
        description: Docker Hub username paired with the access token
        required: true

runs:
    using: composite
    steps:
        - name: Delete ${{ inputs.repository }}:${{ inputs.tag }}
          shell: bash
          env:
              USERNAME: ${{ inputs.username }}
              PASSWORD: ${{ inputs.token }}
              NAMESPACE: ${{ inputs.namespace }}
              REPOSITORY: ${{ inputs.repository }}
              TAG: ${{ inputs.tag }}
          run: |
              jwt=$(curl -sf -X POST "https://hub.docker.com/v2/users/login/" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg u "$USERNAME" --arg p "$PASSWORD" '{username: $u, password: $p}')" \
                  | jq -r '.token')

              # Docker Hub deletes exactly the given tag, leaving other tags on the
              # same digest (e.g. `next`) untouched, so there's no shared-version
              # guard to worry about here unlike GHCR.
              status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "Authorization: Bearer ${jwt}" \
                  "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${REPOSITORY}/tags/${TAG}/")

              if [ "$status" = "204" ] || [ "$status" = "404" ]; then
                  echo "Deleted ${REPOSITORY}:${TAG} (or it was already gone)."
              else
                  echo "Unexpected response (HTTP ${status}) deleting ${NAMESPACE}/${REPOSITORY}:${TAG}." >&2
                  exit 1
              fi
