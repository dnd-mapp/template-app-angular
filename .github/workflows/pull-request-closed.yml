name: Pull request closed
on:
    pull_request:
        types: [closed]

concurrency:
    group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    remove-image:
        name: Remove Docker image
        if: github.event.pull_request.merged == false
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.GH_APP_CLIENT_ID }}
                  private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  permission-packages: write

            - name: Delete pr-${{ github.event.pull_request.number }} image
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  OWNER: ${{ github.repository_owner }}
                  PACKAGE: ${{ github.event.repository.name }}
                  TAG: pr-${{ github.event.pull_request.number }}
              run: |
                  version_id=$(gh api --paginate "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
                      --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" | head -n1)

                  if [ -z "$version_id" ]; then
                      echo "No image tagged ${TAG} found; nothing to delete."
                      exit 0
                  fi

                  gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
                  echo "Deleted ${PACKAGE}:${TAG} (version ${version_id})"
