name: Push to main
on:
    push:
        branches:
            - main

concurrency:
    group: '${{ github.workflow }}-${{ github.ref }}'
    cancel-in-progress: false

jobs:
    ci:
        name: CI
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
            packages: read
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run CI checks
              uses: ./.github/actions/ci

    check-image:
        name: Check for PR Docker image
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            exists: ${{ steps.find.outputs.exists }}
            pr-number: ${{ steps.pr.outputs.number }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.GH_APP_CLIENT_ID }}
                  private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  permission-pull-requests: read

            - name: Determine merged PR number
              id: pr
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
              run: |
                  number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')

                  if [ -z "$number" ]; then
                      echo "No pull request associated with ${SHA}."
                  else
                      echo "Commit ${SHA} was merged from PR #${number}."
                  fi

                  echo "number=$number" >> "$GITHUB_OUTPUT"

            - name: Check whether PR-${{ steps.pr.outputs.number }} changed Docker-relevant paths
              id: changes
              if: steps.pr.outputs.number != ''
              uses: ./.github/actions/detect-docker-changes
              with:
                  base: ${{ github.event.before }}
                  ref: ${{ github.sha }}

            - name: Find image tagged pr-${{ steps.pr.outputs.number }}
              id: find
              if: steps.pr.outputs.number != ''
              uses: ./.github/actions/find-image-version
              with:
                  namespace: ${{ secrets.DH_USERNAME }}
                  repository: ${{ github.event.repository.name }}
                  tag: pr-${{ steps.pr.outputs.number }}
                  token: ${{ secrets.DH_READONLY }}
                  username: ${{ secrets.DH_USERNAME }}

            - name: Fail if an expected image is missing
              if: steps.changes.outputs.docker == 'true' && steps.find.outputs.exists != 'true'
              shell: bash
              run: |
                  echo "PR #${{ steps.pr.outputs.number }} changed Docker-relevant paths, but no image tagged pr-${{ steps.pr.outputs.number }} was found on Docker Hub." >&2
                  exit 1

    promote-image:
        name: Promote Docker image to next
        needs: [ci, check-image]
        if: needs.check-image.outputs.exists == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DH_USERNAME }}
                  password: ${{ secrets.DH_READ_WRITE }}

            - name: Tag image as next
              shell: bash
              env:
                  IMAGE: ${{ secrets.DH_USERNAME }}/${{ github.event.repository.name }}
                  TAG: pr-${{ needs.check-image.outputs.pr-number }}
              run: docker buildx imagetools create --tag "${IMAGE}:next" "${IMAGE}:${TAG}"

    detect-description-change:
        name: Detect description change
        runs-on: ubuntu-22.04
        timeout-minutes: 2
        permissions:
            contents: read
        outputs:
            description: ${{ steps.filter.outputs.description }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check for relevant changes
              id: filter
              uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              with:
                  filters: |
                      description:
                          - '.docker/DOCKERHUB.md'

    sync-description:
        name: Sync Docker Hub description
        needs: [ci, detect-description-change]
        if: needs.detect-description-change.outputs.description == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Sync description to Docker Hub
              uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
              with:
                  username: ${{ secrets.DH_USERNAME }}
                  password: ${{ secrets.DH_READ_WRITE }}
                  repository: ${{ secrets.DH_USERNAME }}/${{ github.event.repository.name }}
                  short-description: Template Angular app for dnd-mapp repositories
                  readme-filepath: ./.docker/DOCKERHUB.md
