name: Push to main
on:
    push:
        branches:
            - main

permissions:
    contents: read
    packages: read

concurrency:
    group: '${{ github.workflow }}-${{ github.ref }}'
    cancel-in-progress: false

jobs:
    ci:
        name: CI
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run CI checks
              uses: ./.github/actions/ci
