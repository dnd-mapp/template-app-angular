# Dependency Resolution
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@dnd-mapp/*'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320

# CLI Settings
engineStrict: true
pmOnFail: error

# Build Settings
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Other Settings
savePrefix: '~'
